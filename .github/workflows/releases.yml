name: Release runa Cross-Platform Binaries

# Pushing a v* tag runs CI, deploys the docs and publishes the release, all for that tag.
# Manual runs default to a dry run: CI builds and packages the release without publishing.
# To publish an existing tag manually: gh workflow run releases.yml --ref <tag> -f dry_run=false
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and package only, skip docs deploy and publishing'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  ci:
    if: github.actor == 'alexm-dev' && (github.ref_type == 'tag' || inputs.dry_run)
    uses: ./.github/workflows/rust.yml

  docs:
    needs: ci
    if: github.ref_type == 'tag' && !inputs.dry_run
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  release:
    needs: [ci, docs]
    if: ${{ !cancelled() && needs.ci.result == 'success' && (needs.docs.result == 'success' || needs.docs.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
      PUBLISH: ${{ github.ref_type == 'tag' && !inputs.dry_run }}
    steps:
      - uses: actions/checkout@v6

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: bin-*

      - name: Organize release assets for archiving
        shell: bash
        run: |
          for dir in artifacts/bin-*; do
            platform=${dir#artifacts/bin-}
            outdir="$dir/runa-$platform"
            mkdir -p "$outdir/docs"

            if [ -f "$dir/rn.exe" ]; then
              mv "$dir/rn.exe" "$outdir/"
            elif [ -f "$dir/rn" ]; then
              mv "$dir/rn" "$outdir/"
            fi
            cp README.md LICENSE-MIT LICENSE-APACHE "$outdir/"
            cp -r docs/config/* "$outdir/docs/"
            cp CHANGELOG.md "$outdir/docs/"
          done

      - name: Create archives
        shell: bash
        run: |
          mkdir -p dist
          for dir in artifacts/bin-*; do
            platform=${dir#artifacts/bin-}
            outdir="runa-$platform"

            if [[ "$platform" == *"windows"* ]]; then
              (cd "$dir" && zip -r "../../dist/${outdir}.zip" "$outdir")
            else
              tar -czvf "dist/${outdir}.tar.gz" -C "$dir" "$outdir"
            fi
          done

      - name: Calculate SHA256SUMS
        shell: bash
        run: |
          cd dist
          sha256sum runa-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload dry run assets
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-dry-run
          path: dist/*

      - uses: actions/attest@v4
        if: env.PUBLISH == 'true'
        with:
          subject-path: |
            dist/runa-*
            dist/SHA256SUMS.txt

      - name: Extract changelog section
        id: extract_changelog
        if: env.PUBLISH == 'true'
        shell: bash
        run: |
          VERSION="${TAG#v}"
          sed 's/\r//' CHANGELOG.md > clean_changelog.md
          awk -v ver="$VERSION" '
            BEGIN { ver_pattern = "\\[v?" ver "\\]" }
            $0 ~ "^#+ " ver_pattern { p=1; next }
            p && ($0 ~ "^---" || $0 ~ "^## \\[") { p=0; exit }
            p { print }
          ' clean_changelog.md > release_notes.md
          sed -i -e :a -e '/^\n*$/{$d;N;ba' -e '}' release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "Error: Extraction failed for version $VERSION"
            exit 1
          fi

      - name: Fail if release exists
        if: env.PUBLISH == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Aborting."
            exit 1
          fi

      - name: Create release and upload assets
        if: env.PUBLISH == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" dist/* --title "runa $TAG" --notes-file release_notes.md
