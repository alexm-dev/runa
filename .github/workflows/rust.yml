name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    if: github.repository_owner == github.actor || github.event.sender.type == 'User'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux Gnu & Musl
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux-x86_64-gnu
            use_cross: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux-aarch64-gnu
            use_cross: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            platform: linux-x86_64-musl
            use_cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            platform: linux-aarch64-musl
            use_cross: true

          # Windows
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            platform: windows-x86_64
            use_cross: false
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            platform: windows-aarch64
            use_cross: false

          # macOS
          - target: x86_64-apple-darwin
            os: macos-latest
            platform: macos-x86_64
            use_cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            platform: macos-aarch64
            use_cross: false

    # Release runs (tag push or release dry run) build without cache and upload the binaries.
    env:
      RELEASE_BUILD: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        if: env.RELEASE_BUILD != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: ${{ matrix.use_cross }}
        env:
          CROSS_VERSION: "v0.2.5"
          PACKAGE_NAME: "cross-x86_64-unknown-linux-gnu.tar.gz"
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          INSTALL_DIR="$HOME/.local/bin"
          mkdir -p "$INSTALL_DIR"

          echo "Downloading cross $CROSS_VERSION using gh CLI..."
          gh release download "$CROSS_VERSION" \
            --repo cross-rs/cross \
            --pattern "$PACKAGE_NAME" \
            -D "$INSTALL_DIR"

          tar -xzf "$INSTALL_DIR/$PACKAGE_NAME" -C "$INSTALL_DIR"
          echo "$INSTALL_DIR" >> $GITHUB_PATH

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fd-find bat
          mkdir -p ~/.local/bin
          ln -s $(which fdfind) ~/.local/bin/fd
          ln -s $(which batcat) ~/.local/bin/bat
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install fd bat

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install fd bat || echo "Ignored choco failure"

      - name: Build
        id: build_step
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Test
        id: test_step
        if: (matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'x86_64-apple-darwin' || matrix.target == 'x86_64-pc-windows-msvc')
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross test --release --locked --target ${{ matrix.target }}
          else
            cargo test --release --locked --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Prepare binary (Linux/macOS)
        if: env.RELEASE_BUILD == 'true' && runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/rn" dist/rn
          chmod +x dist/rn
        shell: bash

      - name: Prepare binary (Windows)
        if: env.RELEASE_BUILD == 'true' && runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/rn.exe" dist/rn.exe
        shell: pwsh

      - name: Upload artifact
        if: env.RELEASE_BUILD == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.platform }}
          path: dist/rn*
          if-no-files-found: error

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy-cache
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Check Formatting
        run: cargo fmt --all -- --check

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable

      - name: Get month
        id: month
        run: echo "month=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cache cargo-audit
        id: cache-audit
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-${{ steps.month.outputs.month }}

      - name: Install cargo-audit
        if: steps.cache-audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit

      - name: Run Audit
        run: cargo audit --deny warnings
